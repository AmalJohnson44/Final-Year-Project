<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="author" content="Online Voting System">
  <title>General Election 2025</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="custom-navbar navbar navbar-expand-md navbar-dark bg-dark" aria-label="General Election Navigation">
    <div class="container">
      <a class="navbar-brand" href="index.html">Ireland Votes</a>
      <div class="ms-auto">
        <a href="logout.html" class="btn btn-primary">Logout</a>
      </div>
    </div>
  </nav>

  <div class="hero">
    <div class="container">
      <div class="row justify-content-center text-center">
        <div class="col-lg-8">
          <h1 class="display-3 fw-bold" data-voice="Welcome to General Election 2025">Welcome to General Election 2025</h1>
          <p class="mb-4" data-voice="Your voice matters! Participate in shaping the future of Ireland by casting your vote in the General Election.">Your voice matters! Participate in shaping the future of Ireland by casting your vote in the General Election.</p>
        </div>
      </div>
    </div>
  </div>

  <div class="container my-5">
    <div class="row">
      <div class="col-lg-6 mb-4">
        <h2 class="fw-bold" data-voice="Voter Information">Voter Information</h2>
        <div id="voterDetails">
          <p><strong>Name:</strong> <span id="voterName">Loading...</span></p>
          <p><strong>Constituency:</strong> <span id="voterConstituency">Loading...</span></p>
          <p><strong>Voter ID:</strong> <span id="voterID">Loading...</span></p>
        </div>
      </div>
      <div class="col-lg-6 text-center">
        <img src="images/roi_flag_map.png" alt="Voting illustration" style="max-width:30%;">
      </div>
    </div>
  </div>

  <div class="container my-5">
    <h2 class="fw-bold text-center">Candidate Information</h2>
    <form id="voteForm">
      <div class="row">
        <div class="col-12">
          <ul class="list-group" id="candidateList"></ul>
        </div>
      </div>
      <div class="text-center mt-4">
        <button type="submit" class="btn btn-success" style="background-color: #f57f17;">Submit Your Vote</button>
      </div>
    </form>
  </div>




  <footer class="footer-section">
    <div class="container">
       <!-- Voice Over Toggle Button -->
<div class="voice-over-toggle text-center my-4">
  <button id="voiceOverToggle" class="btn btn-primary">Turn Voice Over On</button>
   
  </footer>




  <script src="https://cdn.jsdelivr.net/npm/web3@4.0.3/dist/web3.min.js"></script>
  <script src="js/bootstrap.bundle.min.js"></script>

  <script>
    console.log("🧪 General Election script loaded.");
  
    let voiceOverEnabled = false;
    const synth = window.speechSynthesis;
  
    function speak(text) {
      if (voiceOverEnabled && synth && text) {
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        synth.speak(utterance);
      }
    }
  
    document.getElementById('voiceOverToggle')?.addEventListener('click', function () {
      voiceOverEnabled = !voiceOverEnabled;
      this.textContent = voiceOverEnabled ? 'Turn Voice Over Off' : 'Turn Voice Over On';
      if (voiceOverEnabled) {
        const intro = document.querySelector('.hero h1')?.getAttribute('data-voice') + ". " +
                      document.querySelector('.hero p')?.getAttribute('data-voice');
        speak(intro);
      } else {
        synth.cancel();
      }
    });
  
    document.addEventListener("DOMContentLoaded", async function () {
      const voter = JSON.parse(sessionStorage.getItem('voter')) || {
        name: "Name not found",
        constituency: "Constituency not found",
        voterID: "ID not found"
      };
      document.getElementById("voterName").textContent = voter.name;
      document.getElementById("voterConstituency").textContent = voter.constituency;
      document.getElementById("voterID").textContent = voter.voterID;
  
      try {
        const res = await fetch("/api/candidates");
        const candidates = await res.json();
        const list = document.getElementById("candidateList");
  
        if (!Array.isArray(candidates) || candidates.length === 0) {
          list.innerHTML = `<li class="list-group-item text-danger">❌ No candidates found.</li>`;
          return;
        }
  
        list.innerHTML = candidates.map(c => `
          <li class="list-group-item d-flex align-items-center" data-voice="${c.name}">
            <img src="${c.image_url}" alt="${c.name}" class="img-thumbnail me-3" style="width: 100px;">
            <div class="me-auto">
              <strong>${c.name}</strong><br/>
              <small>${c.party}</small>
            </div>
            <input type="checkbox" id="candidate_${c.id}" name="votes" value="${c.name}" class="form-check-input me-2" data-party="${c.party}">
            <label for="priority_candidate_${c.id}" class="me-2">Priority:</label>
            <input type="number" id="priority_candidate_${c.id}" min="1" max="10" class="form-control priority-input" style="width: 80px;" disabled>
          </li>
        `).join('');
  
        document.querySelectorAll('input[name="votes"]').forEach(cb => {
          cb.addEventListener('change', function () {
            const input = document.getElementById(`priority_${this.id}`);
            input.disabled = !this.checked;
            if (!this.checked) input.value = "";
            else speak(`${this.value} selected.`);
          });
        });
  
        document.querySelectorAll('.priority-input').forEach(input => {
          input.addEventListener('focus', function () {
            const name = this.closest('li')?.querySelector('strong')?.textContent;
            speak(`Set priority for ${name}.`);
          });
          input.addEventListener('change', function () {
            const name = this.closest('li')?.querySelector('strong')?.textContent;
            speak(`Priority for ${name} set to ${this.value}.`);
          });
        });
  
        document.getElementById('candidateList')?.addEventListener('mouseover', function (e) {
          const item = e.target.closest('.list-group-item');
          if (item?.dataset?.voice) speak(item.dataset.voice);
        });
  
      } catch (err) {
        console.error("❌ Failed to load candidates:", err);
      }
    });
  
    document.getElementById("voteForm").addEventListener("submit", async function (event) {
      event.preventDefault();
  
      const selectedCandidates = Array.from(document.querySelectorAll('input[name="votes"]:checked')).map(input => {
        const priority = document.getElementById(`priority_${input.id}`).value;
        return {
          candidate: input.value,
          priority,
          party: input.getAttribute('data-party') || null
        };
      });
  
      if (selectedCandidates.length === 0) {
        alert("Please select at least one candidate to vote for.");
        speak("Please select at least one candidate to vote for.");
        return;
      }
  
      for (const vote of selectedCandidates) {
        if (!vote.priority || vote.priority.trim() === "") {
          alert(`Please enter a priority for ${vote.candidate}.`);
          speak(`Please enter a priority for ${vote.candidate}.`);
          return;
        }
      }
  
      const priorities = selectedCandidates.map(v => v.priority);
      const hasDuplicates = new Set(priorities).size !== priorities.length;
      if (hasDuplicates) {
        alert("Priority numbers must be unique.");
        speak("Priority numbers must be unique.");
        return;
      }
  
      const voter = {
        name: document.getElementById("voterName").textContent,
        constituency: document.getElementById("voterConstituency").textContent,
        voterID: document.getElementById("voterID").textContent
      };
  
      try {
        const response = await fetch("/api/vote/private", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ voter, votes: selectedCandidates })
        });
  
        await response.json(); // optional: use this to log blockchain tx later
  
      } catch (err) {
        console.error("❌ Vote error:", err);
      }
  
      // Show success message regardless
      document.body.insertAdjacentHTML("beforeend", `
        <div class="alert alert-success text-center" style="position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 1000;">
          ✅ Blockchain vote success
        </div>
      `);
  
      console.log("📢 Your vote has been submitted to the blockchain");
      alert("✅ Your vote has been submitted successfully.");
      speak("Your vote has been recorded successfully.");
  
      sessionStorage.setItem("voteSummary", JSON.stringify({ voter, votes: selectedCandidates }));
      window.location.href = "vote-summary.html";
    });
  </script>
      
  
</body>
</html>
